[package]
name = "nc-platform"
description = "NoteCraft shell: the egui/eframe window, menus, toolbar, status bar, and settings"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
nc-commands.workspace = true
nc-core.workspace = true
nc-markdown.workspace = true
nc-textproc.workspace = true
thiserror.workspace = true
tracing.workspace = true

# The window shell. egui draws the UI and eframe hosts the window and event loop.
eframe.workspace = true
egui.workspace = true

# Playground's browser build (patches/notepad.yaml): the page's canvas and dialogs, wgpu's backends, and the clock.
[target.'cfg(target_arch = "wasm32")'.dependencies]
notepad-playground = { path = "../../notepad-playground" }
wgpu = { version = "30", features = ["webgpu", "webgl"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Document", "HtmlCanvasElement"] }
web-time = "1"
